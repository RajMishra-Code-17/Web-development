<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transition</title>
    <style>
        .container{
            background-color: yellowgreen;
            height: 40vh;
            width: 50vw;

        }
        .box{
            background-color: aqua;
            height: 4vh;
            width: 5vw;
            /* transition-property: all;
            transition-duration: 3s;
            transition-timing-function: cubic-bezier(1,-0.3, 0.58, 1);
            transition-delay: 1s; */
            /* if you want to use all the three property at once you cn use it by single use  */
            transition: all 3s ease-in-out 1s;

        }
        .translate{
            transform: translateX(10vw) translateY(10vh);
            background-color: aliceblue;
            /* by this translatex and translatey it will leave some space from the x and y direction */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
